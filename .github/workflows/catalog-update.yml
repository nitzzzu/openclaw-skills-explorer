name: Update skills catalog

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch: # allow manual trigger from Actions tab
    inputs:
      full_rescan:
        description: "Force full rescan (ignore last commit checkpoint)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "skills_catalog.py"
      - "blacklist.yaml"

permissions:
  contents: write # needed to commit the updated DB + parquets back

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout openclaw-skills (this repo)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone openclaw/skills (the skills source repo)
        uses: actions/checkout@v4
        with:
          repository: openclaw/skills
          # openclaw/skills is public — no token needed.
          # If it becomes private, add: token: ${{ secrets.SKILLS_REPO_PAT }}
          path: skills-repo
          fetch-depth:
            0 # IMPORTANT: duck_tails reads full git history for
            # incremental sync — a shallow clone breaks it

      - name: Restore DuckDB from cache
        id: cache-duckdb
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/skills_catalog.duckdb
          # Use run_id as key so every successful run saves a fresh entry.
          # restore-keys picks up the most recent previous run on a cache miss.
          key: duckdb-${{ github.run_id }}
          restore-keys: |
            duckdb-

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install Python dependencies
        run: uv sync

      - name: Run skills_catalog.py (incremental)
        run: |
          EXTRA=""
          if [ "${{ inputs.full_rescan }}" = "true" ]; then
            EXTRA="--full-rescan"
          fi
          uv run skills_catalog.py \
            --repo-path  "${{ github.workspace }}/skills-repo" \
            --db         "${{ github.workspace }}/skills_catalog.duckdb" \
            --state-file "${{ github.workspace }}/catalog_state.json" \
            --blacklist  "${{ github.workspace }}/blacklist.yaml" \
            --export-dir "${{ github.workspace }}/skills-dashboard/public" \
            $EXTRA

      - name: Enrich author profiles from GitHub API
        if: env.HAS_GITHUB_TOKEN == 'true'
        run: |
          uv run skills_catalog.py \
            --repo-path  "${{ github.workspace }}/skills-repo" \
            --db         "${{ github.workspace }}/skills_catalog.duckdb" \
            --state-file "${{ github.workspace }}/catalog_state.json" \
            --blacklist  "${{ github.workspace }}/blacklist.yaml" \
            --export-dir "${{ github.workspace }}/skills-dashboard/public" \
            --no-scan \
            --enrich-authors \
            --github-token "${{ secrets.GH_AUTHORS_PAT }}" \
            --author-batch-size 500
        env:
          HAS_GITHUB_TOKEN: ${{ secrets.GH_AUTHORS_PAT != '' }}

      - name: Commit updated parquet files + state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Remove DuckDB from git tracking if it was previously committed
          git rm --cached skills_catalog.duckdb 2>/dev/null || true
          git add catalog_state.json \
                  skills-dashboard/public/skills.parquet \
                  skills-dashboard/public/findings.parquet
          # authors.parquet only exists when enrichment ran
          [ -f skills-dashboard/public/authors.parquet ] && \
            git add skills-dashboard/public/authors.parquet || true
          # Only commit if something actually changed
          git diff --cached --quiet || \
            git commit -m "chore(catalog): automated update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Pull any concurrent pushes before pushing; --autostash handles any
          # unstaged noise (e.g. the skills-repo sub-checkout) automatically
          git pull --rebase --autostash origin main
          git push
